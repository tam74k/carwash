<!DOCTYPE html>
<html lang="en" dir="ltr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="theme-color" content="#000000">
    <title>Premium Car Wash</title>

    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700&display=swap" rel="stylesheet">

    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <!-- Styles -->
    <link rel="stylesheet" href="styles/variables.css">
    <link rel="stylesheet" href="styles/reset.css">

    <style>
        body {
            background: linear-gradient(135deg, var(--color-black) 0%, var(--color-gray-900) 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            overflow: hidden;
        }

        .splash-container {
            text-align: center;
            animation: fadeIn 1s ease;
        }

        .splash-logo {
            width: 120px;
            height: 120px;
            margin: 0 auto var(--space-xl);
            background: linear-gradient(135deg, var(--color-gold) 0%, var(--color-gold-dark) 100%);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            animation: pulse 2s ease-in-out infinite;
            box-shadow: 0 10px 40px rgba(212, 175, 55, 0.4);
        }

        .splash-icon {
            font-size: 56px;
            color: var(--color-white);
        }

        .splash-title {
            font-size: var(--font-size-3xl);
            font-weight: var(--font-weight-bold);
            color: var(--color-white);
            margin-bottom: var(--space-sm);
        }

        .splash-subtitle {
            font-size: var(--font-size-base);
            color: var(--color-gold);
            letter-spacing: 2px;
            text-transform: uppercase;
        }

        .splash-loader {
            width: 40px;
            height: 40px;
            margin: var(--space-xl) auto 0;
            border: 3px solid rgba(255, 255, 255, 0.2);
            border-top-color: var(--color-gold);
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: scale(0.9);
            }

            to {
                opacity: 1;
                transform: scale(1);
            }
        }

        @keyframes pulse {

            0%,
            100% {
                transform: scale(1);
            }

            50% {
                transform: scale(1.05);
            }
        }

        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }
    </style>

    <!-- Supabase -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>

<body>
    <div class="splash-container">
        <div class="splash-logo">
            <i class="fas fa-car-wash splash-icon"></i>
        </div>
        <h1 class="splash-title">Premium Car Wash</h1>
        <p class="splash-subtitle">Excellence in Service</p>
        <div class="splash-loader"></div>
    </div>

    <script src="utils/i18n.js"></script>
    <script src="utils/supabase.js"></script>

    <script>
        // Check authentication and redirect
        async function checkAuth() {
            try {
                // Wait a bit for the splash animation
                await new Promise(resolve => setTimeout(resolve, 2000));

                const user = await getCurrentUser();

                if (user) {
                    // User is logged in, go to home
                    window.location.href = 'pages/home.html';
                } else {
                    // User is not logged in, go to login
                    window.location.href = 'pages/login.html';
                }
            } catch (error) {
                console.error('Auth check error:', error);
                // On error, redirect to login
                window.location.href = 'pages/login.html';
            }
        }

        // Start the check when page loads
        document.addEventListener('DOMContentLoaded', () => {
            checkAuth();
        });
    </script>
</body>

</html>
